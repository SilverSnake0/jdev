<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="#eeeae2"/><g font-family="Arial,sans-serif"><text x="58" y="78" font-size="36" font-weight="700" fill="#173e36">Evidence-aware contract analysis</text><text x="58" y="120" font-size="21" fill="#53645f">From source documents to a reviewable decision.</text><rect x="58" y="185" width="844" height="92" rx="16" fill="#ffffff"/><circle cx="105" cy="231" r="24" fill="#16483f"/><text x="105" y="238" text-anchor="middle" fill="white" font-size="20">1</text><text x="150" y="221" fill="#173e36" font-size="24" font-weight="700">Read &amp; structure</text><text x="150" y="251" fill="#53645f" font-size="19">Extract relevant terms from leases and agreements.</text><rect x="58" y="300" width="844" height="92" rx="16" fill="#ffffff"/><circle cx="105" cy="346" r="24" fill="#16483f"/><text x="105" y="353" text-anchor="middle" fill="white" font-size="20">2</text><text x="150" y="336" fill="#173e36" font-size="24" font-weight="700">Compare &amp; trace</text><text x="150" y="366" fill="#53645f" font-size="19">Keep findings connected to source evidence.</text><rect x="58" y="415" width="844" height="92" rx="16" fill="#ffffff"/><circle cx="105" cy="461" r="24" fill="#16483f"/><text x="105" y="468" text-anchor="middle" fill="white" font-size="20">3</text><text x="150" y="451" fill="#173e36" font-size="24" font-weight="700">Review &amp; decide</text><text x="150" y="481" fill="#53645f" font-size="19">Present structured information for professional review.</text></g></svg>